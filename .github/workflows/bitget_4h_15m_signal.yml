name: Bitget 4H-15M Signal Scanner

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron is UTC.
    # Korea time: 18:03, 18:18, 18:33, 18:48, ...
    - cron: "3,18,33,48 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run signal scanner
        env:
          TELEGRAM_SIGNAL_BOT_TOKEN: ${{ secrets.TELEGRAM_SIGNAL_BOT_TOKEN }}
          TELEGRAM_SIGNAL_CHAT_ID: ${{ secrets.TELEGRAM_SIGNAL_CHAT_ID }}
        run: |
          python bitget_4h_15m_signal_scanner.py

name: Bitget 4H-15M Signal Scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC.
    # Run around every 15-minute candle close.
    - cron: "2,17,32,47 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run signal scanner
        env:
          TELEGRAM_SIGNAL_BOT_TOKEN: ${{ secrets.TELEGRAM_SIGNAL_BOT_TOKEN }}
          TELEGRAM_SIGNAL_CHAT_ID: ${{ secrets.TELEGRAM_SIGNAL_CHAT_ID }}
        run: |
          python bitget_4h_15m_signal_scanner.py

      - name: Save signal state
        run: |
          if git diff --quiet -- signal_state.json; then
            echo "No state changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signal_state.json
            git commit -m "Update signal state"
            git push
          fi

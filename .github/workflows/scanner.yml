name: Bitget 1H Long Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python bitget_1h_long_scanner_v2_2.py
